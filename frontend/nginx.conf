# Mirrors vite.config.ts's dev-server proxy (server.proxy["/api"]): the built static UI still
# needs /api requests forwarded to the backend container, just via nginx instead of Vite.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
