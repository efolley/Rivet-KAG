[project]
name = "rivet-kag"
version = "0.1.0"
description = "Knowledge-Augmented Generation over Milvus + Neo4j"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pymilvus>=2.4",
  "milvus-lite>=2.4; sys_platform != 'win32'",
  "neo4j>=5.20",
  "llama-index-core>=0.11",
  "llama-index-readers-file>=0.2",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "langchain-anthropic>=0.3",
  "deepagents>=0.7",
]

[dependency-groups]
ingest = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
default-groups = ["dev", "ingest"]

[project.optional-dependencies]
# Enable as each integration lands:
# rag = ["langchain", "deepagents", "langfuse"]
# platform = ["sqlalchemy[asyncio]", "asyncpg", "alembic", "redis", "aiokafka", "pyjwt", "passlib[argon2]"]
# eval = ["deepeval"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*", "evals*"]

[tool.ruff]
line-length = 120
src = ["."]
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["src", "utils", "evals"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "fastembed.*", "milvus_lite.*", "llama_index.readers.file.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
