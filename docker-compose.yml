# `docker compose up`                  -> app + postgres + redis (stub pipeline)
# `docker compose --profile full up`   -> adds kafka, milvus, neo4j
services:
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

  backend:
    build: .
    ports: ["8000:8000"]
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+asyncpg://rivet:rivet@postgres:5432/rivet
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: rivet, POSTGRES_PASSWORD: rivet, POSTGRES_DB: rivet }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    profiles: [full]
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]

  neo4j:
    profiles: [full]
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment: { NEO4J_AUTH: neo4j/rivet-dev-password }
    volumes: [neo4jdata:/data]

  milvus:
    profiles: [full]
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    ports: ["19530:19530"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - milvusdata:/var/lib/milvus
      - ./infra/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml

volumes:
  pgdata:
  neo4jdata:
  milvusdata:
